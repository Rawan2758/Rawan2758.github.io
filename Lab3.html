<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerusalem</title>
    <link rel="stylesheet" href="Lab3.css">
</head>
<body>

    <header>
        <h1>A Day in Jerusalem</h1>
        <p>Explore how changing the sequence alters the travel story.</p>
    </header>

    <main>
        <!-- Interactive Control Buttons -->
        <div class="controls">
            <button id="seqA-btn">Sequence A: Morning Market Walk</button>
            <button id="seqB-btn">Sequence B: Afternoon Study</button>
        </div>

        <h2 id="story-title">Sequence A: Morning Market Walk</h2>

        <!-- Story Cards Container -->
        <div class="story-container">
            <div class="card">
                <h3>Beginning</h3>
                <img id="frame1" src="img1.jpeg" alt="Person Reading">
                <p id="caption1">1. Starting the day reading.</p>
            </div>

            <div class="card">
                <h3>Middle</h3>
                <img id="frame2" src="img2.jpeg" alt="Person Walking">
                <p id="caption2">2. Strolling through the streets.</p>
            </div>

            <div class="card">
                <h3>End</h3>
                <img id="frame3" src="img3.jpeg" alt="Person Buying Bread">
                <p id="caption3">3. Buying fresh bread for lunch.</p>
            </div>
        </div>
    </main>

    <!-- Link to JavaScript File -->
    <script src="Lab3.js"></script>
</body>
</html>
