
<!DOCTYPE html>
<html>
<head>
  <title>Makeup Shopping Trip</title>
  <link rel="stylesheet" href="Lab4.css">
</head>
<body>
  <div class="card">
    <h1>Makeup Shopping Trip</h1>
    <p>Time to Shop!</p>

    <h3>Choose your budget</h3>
    <button onclick="shop(10)">$10</button>
    <button onclick="shop(30)">$30</button>
    <button onclick="shop(60)">$60</button>

    <h3>Want a little extra?</h3>
    <button onclick="toggleExtra()">Add lip gloss 💋</button>

    <h2 id="result">Choose your shopping budget!</h2>
    <p id="total">Total: $0</p>
    <p id="status"></p>

    <button onclick="resetShop()">Start Over ↻</button>
  </div>

  <script src="Lab4.js"></script>
</body>
</html>
