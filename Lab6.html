<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jerusalem Now | القدس الآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Lab6.css">
</head>
<body>
<div id="sky"></div><div id="stars"></div><div id="clouds"></div>

<header>
  <h1 id="title">Jerusalem Now</h1>
  <p class="ar-name" lang="ar">القدس</p>
  <div class="controls">
    <button id="lang" type="button">العربية</button>
    <button id="sound" type="button">Begin ambient wind</button>
  </div>
  <p id="status" role="status">Loading live data…</p>
</header>

<main id="info">
  <section class="card" id="weather"></section>
  <section class="card" id="prayers"></section>
</main>

<svg id="skyline" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax slice" aria-label="Skyline of the Old City">
  <path class="hill" d="M640 250 Q800 140 1000 185 L1000 250Z"/>
  <g class="site" data-key="olives" tabindex="0" role="button"><rect class="hit" x="760" y="150" width="240" height="100"/><rect class="stone" x="880" y="160" width="10" height="40"/><path class="stone" d="M877 160 l8 -14 l8 14z"/></g>
  <rect class="wall" x="0" y="232" width="1000" height="22"/>
  <g class="site" data-key="damascus" tabindex="0" role="button"><rect class="stone" x="90" y="196" width="34" height="56"/><rect class="stone" x="156" y="196" width="34" height="56"/><rect class="stone" x="124" y="214" width="32" height="38"/><path class="dark" d="M132 252 v-16 a8 8 0 0 1 16 0 v16z"/><path class="stone" d="M90 196 h34 M156 196 h34" stroke-width="6"/></g>
  <g class="site" data-key="sepulchre" tabindex="0" role="button"><rect class="stone" x="250" y="200" width="80" height="52"/><path class="stone" d="M264 200 a18 18 0 0 1 36 0z"/><rect class="stone" x="312" y="166" width="14" height="34"/><path class="stone" d="M310 166 l9 -14 l9 14z"/></g>
  <g class="site" data-key="dome" tabindex="0" role="button"><rect class="stone" x="420" y="196" width="120" height="56"/><path class="gold" d="M435 196 a45 45 0 0 1 90 0z"/><rect class="gold" x="478" y="140" width="4" height="12"/></g>
  <g class="site" data-key="aqsa" tabindex="0" role="button"><rect class="stone" x="565" y="214" width="100" height="38"/><path class="silver" d="M595 214 a20 20 0 0 1 40 0z"/><rect class="stone" x="668" y="170" width="9" height="82"/><path class="stone" d="M666 170 l6 -16 l6 16z"/></g>
  <rect class="ground" x="0" y="252" width="1000" height="48"/>
</svg>

<aside id="panel" hidden aria-live="polite">
  <button id="close" type="button" aria-label="Close">✕</button>
  <img id="pImg" alt="" hidden>
  <h2 id="pTitle"></h2>
  <p id="pText"></p>
  <a id="pLink" target="_blank" rel="noopener"></a>
</aside>

<svg class="tatreez" aria-hidden="true"><defs><pattern id="t" width="12" height="12" patternUnits="userSpaceOnUse"><g fill="#b3202a"><rect x="3" y="0" width="3" height="3"/><rect x="6" y="0" width="3" height="3"/><rect x="0" y="3" width="12" height="3"/><rect x="0" y="6" width="12" height="3"/><rect x="3" y="9" width="3" height="3"/><rect x="6" y="9" width="3" height="3"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#t)"/></svg>

<script src="Lab6.js"></script>
</body>
</html>
